[project]

name = "bicing-predict"
description = "Predictor model of Bicing (Barcelona) availability using FastAPI and custom gradient descent"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12" 
dependencies = [
    "asgi-lifespan>=2.1.0",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pytest-asyncio>=1.4.1.post1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
] 

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[tool.mypy]
ignore_missing_imports = true

