[project]

name = "bicing-predict"
description = "Predictor model of Bicing (Barcelona) availability using FastAPI and custom gradient descent"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12" 
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
] 

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
